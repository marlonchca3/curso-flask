{% extends "base.html" %}

{% block title %}Crear nota{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white shadow-lg rounded-lg p-6">
    <h1 class="text-3xl font-bold text-gray-900 mb-6">Crear una nueva nota</h1>

    <form method="POST" class="space-y-5">
        <div>
            <label for="title" class="block text-sm font-medium text-gray-700 mb-2">Nota</label>
            <input type="text" name="title" id="title" required
                class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">
        </div>

        <div>
            <label for="content" class="block text-sm font-medium text-gray-700 mb-2">Contenido</label>
            <textarea name="content" id="content" rows="5" required
                class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"></textarea>
        </div>

        <button type="submit"
            class="rounded-lg bg-blue-600 px-5 py-2 font-semibold text-white hover:bg-blue-700">
            Crear Nota
        </button>
    </form>
</div>
{% endblock %}
